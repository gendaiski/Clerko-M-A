<title>Clerko M&amp;A Platform Demo</title>
<style>
:root{
  --bg:#f6f7fc; --card:#ffffff; --ink:#0f172a; --text:#334155; --muted:#64748b; --line:#e3e6f3;
  --soft:#eef0fb; --indigo:#4f46e5; --indigo-2:#4338ca; --purple:#7c3aed; --green:#059669; --green-bg:#e7f7f0;
  --amber:#b45309; --amber-bg:#fdf3e2; --red:#dc2626; --red-bg:#fdecec; --blue:#2563eb; --blue-bg:#e8effd;
  --violet-bg:#f1ebfd; --grad:linear-gradient(135deg,#4f46e5,#7c3aed); --grad-green:linear-gradient(135deg,#10b981,#059669);
  --shadow:0 8px 24px rgba(30,27,75,.07);
  font-family:"Segoe UI",ui-sans-serif,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0c0f1d; --card:#141830; --ink:#f1f3fb; --text:#cdd3e6; --muted:#8e97b5; --line:#262c4a;
  --soft:#1b2042; --indigo:#8b87ff; --indigo-2:#a5a2ff; --green:#34d399; --green-bg:#0f2e25; --amber:#fbbf24; --amber-bg:#33260c;
  --red:#f87171; --red-bg:#3a1414; --blue:#7aa7ff; --blue-bg:#15213f; --violet-bg:#241a44; --shadow:0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0c0f1d; --card:#141830; --ink:#f1f3fb; --text:#cdd3e6; --muted:#8e97b5; --line:#262c4a;
  --soft:#1b2042; --indigo:#8b87ff; --indigo-2:#a5a2ff; --green:#34d399; --green-bg:#0f2e25; --amber:#fbbf24; --amber-bg:#33260c;
  --red:#f87171; --red-bg:#3a1414; --blue:#7aa7ff; --blue-bg:#15213f; --violet-bg:#241a44; --shadow:0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 40px}
h1,h2,h3,h4{color:var(--ink);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.02em}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--ink);font-size:17px;border:0;background:none;padding:0}
.mark{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff}
.brand em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.roles{margin-left:auto;display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;flex-wrap:wrap}
.roles button{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.roles button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.nav{display:flex;gap:4px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.nav button{border:0;background:none;padding:7px 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.nav button[aria-current="page"]{background:var(--card);color:var(--indigo);box-shadow:var(--shadow)}
.count{background:var(--indigo);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.demo-note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;padding:10px 14px;border-radius:12px;background:var(--violet-bg);font-size:13px;color:var(--text)}
.demo-note strong{color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--indigo);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}

main{margin-top:20px;display:grid;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--indigo);margin-bottom:4px}
.sub{color:var(--muted);margin-top:4px;max-width:68ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:24px;color:var(--ink);font-weight:800}
.kpi span{font-size:13px;color:var(--muted)}
.side{display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 320px;align-items:start}
@media (max-width:900px){.side{grid-template-columns:1fr}}

/* controls */
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--indigo)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent}
.btn.green{background:var(--grad-green);color:#fff;border-color:transparent}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:14px}
textarea{min-height:84px;resize:vertical}
.fields{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.err{font-size:13px;color:var(--red);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}

/* badges */
.b{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.b-green{background:var(--green-bg);color:var(--green)}.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-indigo{background:var(--soft);color:var(--indigo)}.b-violet{background:var(--violet-bg);color:var(--purple)}
.b-slate{background:var(--soft);color:var(--muted)}

/* listing card */
.lc{display:flex;flex-direction:column;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);text-align:left;padding:0}
.lc:hover{border-color:var(--indigo)}
.lc-top{background:var(--grad);color:#fff;padding:16px 18px}
.lc-top .price{font-size:26px;font-weight:800;margin-top:10px}
.lc-top .tags{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;font-weight:700}
.lc-top .tags span{background:rgba(255,255,255,.2);border-radius:99px;padding:2px 8px}
.lc-b{padding:16px 18px;display:grid;gap:10px}
.lc-b .sector{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--soft);border-radius:10px;padding:8px 10px}
.fact b{display:block;color:var(--ink)}.fact span{font-size:12px;color:var(--muted)}

/* tables & lists */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
dl.kv{display:grid;grid-template-columns:minmax(120px,36%) 1fr;margin:0}
dl.kv dt,dl.kv dd{padding:8px 0;border-bottom:1px solid var(--line);margin:0}
dl.kv dt{color:var(--muted)}dl.kv dd{color:var(--ink);font-weight:600}
.list{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}

/* stepper */
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.steps .s{display:flex;gap:6px;align-items:center}
.steps .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:12px}
.steps .done .dot{background:var(--green);color:#fff}
.steps .cur{color:var(--ink)}.steps .cur .dot{background:var(--grad);color:#fff}
.steps .sep{width:18px;height:1px;background:var(--line)}

/* tabs */
.tabs{display:inline-flex;gap:4px;background:var(--soft);border-radius:12px;padding:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* deal room */
.q{border:1px solid var(--line);border-radius:14px;padding:14px}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--grad);flex:none}
.av.s{background:var(--grad-green)}
.ans{margin-top:10px;margin-left:14px;padding-left:14px;border-left:2px solid var(--line);display:grid;gap:10px}
.offer{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.offer-h{background:var(--grad);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600}
.offer-b{padding:14px 16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.offer-b small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.offer-b b{color:var(--ink)}
.agent{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.agent-h{background:var(--grad);color:#fff;padding:12px 16px;font-weight:700;display:flex;gap:8px;align-items:center}
.agent-b{padding:16px;display:grid;gap:12px;font-size:14px}
.agent-b ul{margin:0;padding-left:18px;color:var(--text)}
.tiny{font-size:12px;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:grid;gap:12px}
.timeline li{position:relative;font-size:14px}
.timeline li::before{content:"";position:absolute;left:-25px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--indigo);box-shadow:0 0 0 3px var(--card)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.callout{border-radius:12px;padding:12px 14px;font-size:14px}
.callout.ok{background:var(--green-bg);color:var(--green)}
.callout.warn{background:var(--amber-bg);color:var(--amber)}
.callout.info{background:var(--blue-bg);color:var(--blue)}
.callout.bad{background:var(--red-bg);color:var(--red)}
.nda{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg);font-size:14px;display:grid;gap:10px}
.progress{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--grad);transition:width .6s}

/* modal & toast */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--card);border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal .card-b{display:grid;gap:14px}
.docpage{position:relative;overflow:hidden;background:#fff;color:#1e293b;border-radius:10px;border:1px solid #e2e8f0;padding:22px;min-height:300px;font-size:13px}
.docpage .wm{position:absolute;inset:-40%;display:grid;align-content:center;gap:48px;transform:rotate(-28deg);pointer-events:none;color:rgba(79,70,229,.13);font-weight:800;font-size:14px;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="top"><div class="wrap">
  <button class="brand" data-go="home" aria-label="Clerko M&amp;A home"><span class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/></svg></span>Clerko <em>M&amp;A</em></button>

</div>

<script>
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const bd = (n, full) => {
  if (n == null || isNaN(n)) return '—';
  if (!full && n >= 1e6) return 'BD ' + (+(n / 1e6).toFixed(2)) + 'M';
  if (!full && n >= 1e4) return 'BD ' + (+(n / 1e3).toFixed(0)) + 'K';
  return 'BD ' + Number(n).toLocaleString('en-US');
};
const now = () => new Date().toISOString();
const ago = (iso) => {
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'just now'; if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago'; const d = Math.round(s / 86400);
  return d === 1 ? 'Yesterday' : d + ' days ago';
};
const hoursAgo = (h) => new Date(Date.now() - h * 3600e3).toISOString();
const uid = () => Math.random().toString(36).slice(2, 9);
function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16).padStart(8, '0'); }

const SECTORS = { technology: 'Technology', consulting: 'Consulting', manufacturing: 'Manufacturing', food: 'Food & Beverage', hospitality: 'Hospitality', marketing: 'Marketing & Media', logistics: 'Logistics' };
const TIERS = { standard: { name: 'Standard', price: 299, f: ['Anonymised teaser listing', 'Standard visibility', 'Interest pipeline dashboard'] }, premium: { name: 'Premium', price: 699, f: ['Everything in Standard', 'Priority placement + valuation support', 'Documentation assistance'] }, enterprise: { name: 'Enterprise', price: 1299, f: ['Everything in Premium', 'Dedicated deal advisor', 'Full valuation & documentation service'] } };
const STAGES = { nda_requested: ['NDA requested', 'slate'], nda_signed: ['NDA signed', 'blue'], pack_unlocked: ['Pack unlocked', 'indigo'], deal_room: ['Deal room', 'violet'], offer: ['Indicative offer', 'amber'], headline_terms: ['Headline terms', 'green'], withdrawn: ['Withdrawn', 'slate'] };
const RANK = { nda_requested: 1, nda_signed: 2, pack_unlocked: 3, deal_room: 4, offer: 5, headline_terms: 6 };
const STRUCT = { full: 'Full acquisition', majority: 'Majority stake', minority: 'Minority stake' };
const QCATS = { financial: 'Financial', commercial: 'Commercial', legal: 'Legal', operational: 'Operational', people: 'People & HR', document_request: 'Document request', other: 'Other' };
const badge = (label, tone = 'slate') => `<span class="b b-${tone}">${esc(label)}</span>`;

/* ---------- seed ---------- */
function seed() {
  const L = (id, ref, company, headline, sector, band, est, revenue, ebitda, growth, price, tier, views, highlights, status = 'live') => ({ id, ref, company, headline, sector, band, est, revenue, ebitda, growth, price, tier, featured: tier !== 'standard', views, highlights, status, loc: 'Manama, Bahrain', summary: 'An established Bahrain business with a strong track record. Full identity, financials and documents are released after the NDA.' });
  const s = {
    role: 'buyer', view: 'buyer', param: null, tab: 'qa', packTab: 'overview', filter: [],
    users: { buyer: { name: 'Aisha Khan', email: 'buyer@clerko.test', alias: 'Buyer #A7', type: 'Strategic acquirer', kyc: 'verified' }, seller: { name: 'Michael Rodriguez', email: 'seller@clerko.test', kyc: 'verified' } },
    premium: false,
    companies: [
      { id: 'c1', name: 'Meridian Cloud W.L.L.', cr: '114231-1', form: 'With Limited Liability Company', crStatus: 'ACTIVE', reg: '2018-03-14', exp: '2027-03-14', capital: 50000, address: 'Flat 21, Building 1565, Road 1722, Block 317, Manama', kyb: 'verified', extraction: 'completed', owner: 'seller' },
      { id: 'c2', name: 'Seef Logistics W.L.L.', cr: '118902-1', form: 'With Limited Liability Company', crStatus: 'ACTIVE', reg: '2016-05-02', exp: '2026-10-12', capital: 100000, address: 'Building 22, Road 2803, Block 428, Seef', kyb: 'pending', extraction: 'completed', owner: 'other' },

    listings: [

      L('l2', 'L-44067', null, 'High-growth digital transformation consultancy', 'consulting', '11–50', 2019, 950000, 260000, 35, 2800000, 'premium', 156, ['Digital transformation', 'Blue-chip clients']),
      L('l3', 'L-51190', null, 'ISO-certified light manufacturer, export ready', 'manufacturing', '51–200', 2015, 4100000, 720000, 12, 5200000, 'standard', 189, ['ISO certified', 'Export ready']),
      L('l4', 'L-30511', null, 'Established fresh-food brand with retail network', 'food', '11–50', 2017, 720000, 150000, 18, 1400000, 'standard', 98, ['Retail network', 'Brand recognition']),
      L('l5', 'L-77120', null, 'Prime-location hospitality business with loyal customers', 'hospitality', '51–200', 2016, 2600000, 540000, 22, 3900000, 'enterprise', 210, ['Prime location', 'Loyal customers']),

      ],

  const q = [['moderation', 'Listings to review', c.moderation], ['kyb', 'Companies to verify', c.kyb], ['kyc', 'Identity checks', c.kyc], ['compliance', 'Compliance flags', c.compliance]];
  return `<div class="head"><div><div class="eyebrow">Admin console</div><h1>Platform overview</h1><p class="sub">Marketplace health, verification queues and compliance.</p></div></div>
  <div class="kpis"><div class="kpi"><b class="num">${bd(agreed)}</b><span>Agreed deal value</span></div><div class="kpi"><b>${S.listings.filter((l) => l.status === 'live').length}</b><span>Live listings</span></div><div class="kpi"><b>${S.engagements.length}</b><span>Buyer engagements</span></div><div class="kpi"><b>${S.room.status === 'open' ? 1 : 0}</b><span>Open deal rooms</span></div></div>
  <div class="grid g3">${q.map(([v, t, n]) => `<button class="card card-b" data-go="${v}" style="text-align:left;display:grid;gap:6px"><div class="row" style="justify-content:space-between"><h3>${t}</h3><b style="font-size:24px;color:${n ? 'var(--amber)' : 'var(--green)'}">${n}</b></div><span class="tiny">${n ? 'Needs attention →' : 'Nothing waiting'}</span></button>`).join('')}</div>`;
};
V.moderation = () => {
  const rows = S.listings.filter((l) => l.status !== 'live' || l.id === 'l1');
  return `<div class="head"><div><div class="eyebrow">Admin</div><h1>Listing moderation</h1><p class="sub">Approval needs the seller's identity (KYC) and the company (KYB) to be verified.</p></div></div>
  <div class="list">${rows.map((l) => { const c = company(l.company); return `<section class="card card-b" style="display:grid;gap:10px"><div class="row" style="justify-content:space-between"><div><div class="tiny mono">${l.ref}</div><h3>${esc(l.headline)}</h3><div class="tiny">${esc(c?.name)} · ${SECTORS[l.sector]} · ${bd(l.price)} · ${TIERS[l.tier]?.name}</div></div>${l.status === 'live' ? badge('Live', 'green') : l.status === 'revision' ? badge('Revision requested', 'violet') : badge('Under review', 'amber')}</div>
   <div class="row">${badge('Seller KYC verified', 'green')}${c?.kyb === 'verified' ? badge('Company KYB verified', 'green') : badge('Company KYB pending', 'amber')}</div>
   ${l.status === 'pending_review' ? `<div class="row"><button class="btn green sm" data-act="approve" data-p="${l.id}">Approve &amp; publish</button><button class="btn sm" data-act="revise" data-p="${l.id}">Request revision</button>${c?.kyb !== 'verified' ? `<button class="btn ghost sm" data-go="kyb">Verify company first →</button>` : ''}</div>` : ''}</section>`; }).join('')}</div>`;
};
V.kyb = () => `<div class="head"><div><div class="eyebrow">Admin · KYB</div><h1>Company verification</h1><p class="sub">Check the extracted profile against the Sijilat CR PDF, then verify or reject.</p></div></div>
 <div class="list">${S.companies.map((c) => `<section class="card"><div class="card-h"><div><h3>${esc(c.name)}</h3><div class="tiny">CR ${esc(c.cr)} · extracted by Xtracta</div></div>${badge(c.kyb === 'verified' ? 'Verified' : c.kyb === 'rejected' ? 'Rejected' : 'Pending', c.kyb === 'verified' ? 'green' : c.kyb === 'rejected' ? 'red' : 'amber')}</div>
 <div class="card-b grid g2"><div class="docpage" aria-label="CR PDF preview"><b>Ministry of Industry and Commerce · Sijilat</b><p style="margin-top:8px">Commercial Registration Profile</p><p style="margin-top:8px">CR No.: ${esc(c.cr)}<br>Commercial Name (EN): ${esc(c.name)}<br>CR Type: ${esc(c.form)}<br>Status: ${esc(c.crStatus)}<br>Registration Date: ${esc(c.reg)}<br>Expiration Date: ${esc(c.exp)}<br>Issued Capital: ${Number(c.capital).toLocaleString('en-US')}</p></div>
 <div style="display:grid;gap:12px;align-content:start"><dl class="kv"><dt>CR No.</dt><dd class="num">${esc(c.cr)}</dd><dt>Name</dt><dd>${esc(c.name)}</dd><dt>Status</dt><dd>${esc(c.crStatus)}</dd><dt>Expiry</dt><dd>${esc(c.exp)}</dd><dt>Address</dt><dd>${esc(c.address)}</dd></dl>
 ${c.kyb === 'pending' ? `<div class="row"><button class="btn green sm" data-act="kyb" data-p="${c.id}">Verify company</button><button class="btn sm danger" data-act="kyb-reject" data-p="${c.id}">Reject</button></div>` : ''}</div></div></section>`).join('')}</div>`;
V.kyc = () => `<div class="head"><div><div class="eyebrow">Admin · KYC</div><h1>Identity verification</h1></div></div>
 <div class="list">${S.kyc.map((k) => `<section class="card card-b" style="display:grid;gap:10px"><div class="row" style="justify-content:space-between"><div><h3>${esc(k.name)}</h3><div class="tiny">${esc(k.email)} · ${esc(k.idType)} ${esc(k.idNo)} · expires ${esc(k.expiry)}</div></div>${badge(k.status === 'pending' ? 'Pending' : k.status === 'verified' ? 'Verified' : 'Rejected', k.status === 'pending' ? 'amber' : k.status === 'verified' ? 'green' : 'red')}</div>
 ${k.status === 'pending' ? `<div class="row"><button class="btn green sm" data-act="kyc" data-p="${k.id}">Verify identity</button><button class="btn sm danger" data-act="kyc-reject" data-p="${k.id}">Reject</button></div>` : ''}</section>`).join('')}</div>`;
V.compliance = () => `<div class="head"><div><div class="eyebrow">Admin · Compliance</div><h1>Off-platform contact flags</h1><p class="sub">Messages that tried to share contact details. Parties saw the redacted text; admins see the original.</p></div></div>
 ${S.flags.length ? `<div class="list">${S.flags.map((f) => `<section class="card card-b" style="display:grid;gap:8px"><div class="row" style="justify-content:space-between"><b style="color:var(--ink)">Possible off-platform contact · ${esc(f.by)}</b>${badge(f.status === 'open' ? 'Open' : f.status === 'cleared' ? 'Cleared' : 'Actioned', f.status === 'open' ? 'amber' : f.status === 'cleared' ? 'green' : 'red')}</div><div class="item mono" style="font-size:13px">${esc(f.text)}</div>${f.status === 'open' ? `<div class="row"><button class="btn sm" data-act="flag" data-p="${f.id}:cleared">Clear</button><button class="btn sm danger" data-act="flag" data-p="${f.id}:actioned">Mark actioned</button></div>` : ''}</section>`).join('')}</div>` : '<div class="card card-b">No flags yet. Try it: in the deal room, post a question containing an email address or phone number.</div>'}`;
V.audit = () => `<div class="head"><div><div class="eyebrow">Admin</div><h1>Audit trail</h1></div></div><section class="card card-b">${ROOM.audit()}</section>`;

/* ---------- render ---------- */
function render() {
  if (!NAV[S.role].some(([v]) => v === S.view) && !['listing', 'nda', 'unlock', 'pack', 'tier', 'room', 'market', 'home', 'pricing'].includes(S.view)) S.view = HOME[S.role];
  if (S.view === 'room' && !S.tab) S.tab = 'qa';
  renderNav();
  $('#app').innerHTML = (V[S.view] || V[HOME[S.role]])();
  if (S.view === 'newListing') listingPreview();
}

/* ---------- actions ---------- */
const REDACT = '[contact details removed]';
function screen(text) {
  let hit = false;
  let clean = text.replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, () => { hit = true; return REDACT; })
    .replace(/\b(?:https?:\/\/|www\.)\S+/gi, () => { hit = true; return REDACT; })
    .replace(/(?<!\d)(?:\+|00)?\d[\d\s().-]{6,}\d(?!\d)/g, (m) => (m.replace(/\D/g, '').length >= 8 && !/^\d{4}\s*[-/.]\s*\d{1,4}/.test(m.trim()) ? ((hit = true), REDACT) : m));
  if (/\b(whats\s?app|telegram|signal|call me|text me)\b/i.test(text)) hit = true;
  return { clean, hit };
}
function flagIfNeeded(original, hit) {
  if (!hit) return;
  S.flags.unshift({ id: uid(), by: party() === 'buyer' ? 'Buyer #A7' : 'Seller', text: original, status: 'open' });
  audit('Message flagged by the contact policy', 'System'); toast('Contact details were removed and flagged to compliance.');
}
function summarise() {
  const r = S.room; const open = r.offers.find((o) => o.status === 'open');
  const qs = r.questions.filter((q) => q.status === 'open');
  const text = `The buyer and seller have exchanged ${r.questions.length} questions, ${r.questions.length - qs.length} of them answered, and ${r.released.length} document${r.released.length === 1 ? ' has' : 's have'} been released. ` + (r.terms ? (r.terms.agreed ? `Both parties have confirmed headline terms at ${bd(r.terms.price, true)}.` : `An offer at ${bd(r.terms.price, true)} was accepted and awaits confirmation.`) : open ? `There is an open ${open.counter ? 'counter-offer' : 'offer'} from the ${open.from} at ${bd(open.price, true)}.` : 'No offer is currently on the table.');
  const openPts = qs.map((q) => `${QCATS[q.cat]}: ${q.body.length > 80 ? q.body.slice(0, 80) + '…' : q.body}`);
  if (r.terms && !r.terms.agreed) openPts.push(`Headline terms awaiting confirmation by the ${r.terms.buyerAck ? 'seller' : 'buyer'}`);
  r.agent.summary = { text, open: openPts, buyer: [...new Set(r.questions.filter((q) => q.from === 'buyer').map((q) => QCATS[q.cat] + ' diligence'))], at: now() };
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-role],[data-role-go],[data-go],[data-act]'); if (!t) return;
  const p = t.dataset.p;
  if (t.dataset.role) { S.role = t.dataset.role; S.view = HOME[S.role]; S.countering = false; save(); render(); return; }
  if (t.dataset.roleGo) { S.role = t.dataset.roleGo; go(HOME[S.role]); return; }
  if (t.dataset.go) { go(t.dataset.go, p ?? null); return; }
  const a = t.dataset.act; const r = S.room;
  switch (a) {
    case 'close-bg': if (ev.target === t) closeModal(); return;
    case 'close': closeModal(); return;
    case 'reset': S = seed(); save(); render(); toast('Demo reset to the starting point.'); return;
    case 'filter': S.filter = S.filter.includes(p) ? S.filter.filter((x) => x !== p) : [...S.filter, p]; break;
    case 'request': { const e = { id: uid(), listing: p, buyer: 'Buyer #A7', type: 'Strategic acquirer', stage: 'nda_requested', mine: true, at: now() }; S.engagements.push(e); audit('Access requested', 'Buyer', listing(p).ref); save(); go('nda', e.id); toast('Seller notified of your interest.'); return; }
    case 'unlock-pay': pay(250, `Company Details Pack for ${listing(S.engagements.find((e) => e.id === p).listing).ref}`, () => { const e = S.engagements.find((x) => x.id === p); advance(e, 'pack_unlocked'); audit('Pack unlocked', 'Buyer', 'Per-company, BD 250'); go('pack', p); toast('Payment received. Details Pack unlocked.'); }); return;
    case 'premium': pay(699, 'Clerko Buyer Premium, one month', () => { S.premium = true; audit('Buyer Premium activated', 'Buyer'); save(); render(); toast('Buyer Premium is active.'); }); return;
    case 'unlock-premium': { const e = S.engagements.find((x) => x.id === p); advance(e, 'pack_unlocked'); audit('Pack unlocked', 'Buyer', 'Premium plan'); save(); go('pack', p); toast('Unlocked with your Premium plan.'); return; }
    case 'pay-ok': closeModal(); pay.cb?.(); return;
    case 'pay-fail': closeModal(); toast('The payment did not go through. Nothing was unlocked.'); return;
    case 'pack-tab': S.packTab = p; break;
    case 'enter-room': advance(S.engagements.find((e) => e.id === p), 'deal_room'); S.tab = 'qa'; save(); go('room'); return;
    case 'doc': modal(`<div class="card-h"><div><div class="eyebrow">Watermarked document</div><h2>${esc(p)}</h2></div><button class="btn sm" data-act="close">Close</button></div><div class="card-b"><div class="docpage"><div class="wm" aria-hidden="true">${Array(8).fill(`CONFIDENTIAL · Clerko M&amp;A · ${esc(S.role === 'seller' ? 'Seller' : 'Buyer #A7')} · ${new Date().toLocaleDateString('en-GB')} · NDA-bound`).map((x) => `<span>${x}</span>`).join('')}</div><b>${esc(p)}</b><p style="margin-top:10px">Sample content for the demo. On the live platform the real PDF is stamped with the viewer's account, email and time on every page, and this view is written to the access log.</p></div><p class="tiny">This view was logged.</p></div>`); audit('Document viewed', S.role === 'seller' ? 'Seller' : 'Buyer', p); save(); return;
    case 'room-tab': S.tab = p; S.countering = false; break;
    case 'close-q': { const q = r.questions.find((x) => x.id === p); q.status = 'closed'; audit('Question marked resolved', cap(party())); break; }
    case 'release': { const d = r.staged.find((x) => x.id === p); r.staged = r.staged.filter((x) => x.id !== p); r.released.push({ ...d, at: now() }); audit('Document released', 'Seller', d.title); toast('Released to Buyer #A7.'); break; }
    case 'counter-open': S.countering = !S.countering; break;
    case 'offer': {
      const o = r.offers.find((x) => x.status === 'open'); if (!o) break;
      if (p === 'withdraw') { o.status = 'withdrawn'; audit('Offer withdrawn', cap(party())); toast('Offer withdrawn.'); }
      if (p === 'reject') { o.status = 'rejected'; audit('Offer declined', cap(party())); toast('Offer declined.'); }
      if (p === 'accept') { o.status = 'accepted'; r.terms = { price: o.price, structure: o.structure, stake: o.stake, deposit: o.deposit, cond: o.cond, buyerAck: party() === 'buyer', sellerAck: party() === 'seller', agreed: false }; audit('Offer accepted', cap(party()), bd(o.price, true)); S.tab = 'terms'; toast('Offer accepted. Headline terms are ready to confirm.'); }
      S.countering = false; break;
    }
    case 'ack': { const tm = r.terms; tm[party() + 'Ack'] = true; audit('Headline terms confirmed', cap(party())); if (tm.buyerAck && tm.sellerAck) { tm.agreed = true; S.engagements[0].stage = 'headline_terms'; audit('Headline terms agreed by both parties', 'System', bd(tm.price, true)); toast('Headline terms agreed by both parties.'); } else toast('Confirmed. Waiting for the other party.'); break; }
    case 'withdraw': modal(`<div class="card-h"><h2>Withdraw from this deal room?</h2></div><div class="card-b"><p>The deal room closes for both parties and any open offer is withdrawn. The record stays available.</p><div class="row"><button class="btn danger" data-act="withdraw-yes">Withdraw</button><button class="btn" data-act="close">Cancel</button></div></div>`); return;
    case 'withdraw-yes': closeModal(); r.status = 'closed'; r.offers.forEach((o) => { if (o.status === 'open') o.status = 'withdrawn'; }); S.engagements[0].stage = 'withdrawn'; audit('Party withdrew from the deal room', cap(party())); toast('You withdrew. Use Reset demo to start again.'); break;
    case 'agent-opt': r.agent[party()] = !r.agent[party()]; audit(r.agent[party()] ? 'Clerko Agent switched on' : 'Clerko Agent switched off', cap(party())); if (!(r.agent.buyer && r.agent.seller)) r.agent.summary = null; break;
    case 'agent-run': summarise(); audit('Clerko Agent summary generated', cap(party())); toast('Summary updated.'); break;
    case 'upload': S.upload = { step: 0 }; save(); render(); tick(); return;
    case 'upload-reset': S.upload = null; break;
    case 'tier': { const d = S.sellerDraft; pay(TIERS[p].price, `${TIERS[p].name} listing, one month`, () => { const l = { id: uid(), ref: 'L-' + Math.floor(10000 + Math.random() * 89999), company: d.company, headline: d.headline, summary: d.summary, sector: d.sector, band: '11–50', est: 2021, revenue: +d.revenue || 0, ebitda: Math.round((+d.revenue || 0) * 0.2), growth: +d.growth || 0, price: +d.price || 0, tier: p, featured: p !== 'standard', views: 0, highlights: ['New listing'], status: 'pending_review', loc: 'Manama, Bahrain' }; S.listings.push(l); S.sellerDraft = null; audit('Listing submitted for review', 'Seller', l.ref); save(); go('seller'); toast('Paid. Your listing is with our team for review.'); }); return; }
    case 'approve': { const l = listing(p); if (company(l.company)?.kyb !== 'verified') { toast('Verify the company (KYB) before approving.'); return; } l.status = 'live'; l.views = 0; audit('Listing approved and published', 'Admin', l.ref); toast('Listing is live on the marketplace.'); break; }
    case 'revise': { const l = listing(p); l.status = 'revision'; audit('Revision requested', 'Admin', l.ref); toast('Seller asked for a revision.'); break; }
    case 'kyb': { const c = company(p); c.kyb = 'verified'; audit('Company verified (KYB)', 'Admin', c.name); toast(c.name + ' verified.'); break; }
    case 'kyb-reject': { const c = company(p); c.kyb = 'rejected'; audit('Company rejected (KYB)', 'Admin', c.name); break; }
    case 'kyc': { const k = S.kyc.find((x) => x.id === p); k.status = 'verified'; audit('Identity verified (KYC)', 'Admin', k.name); toast(k.name + ' verified.'); break; }
    case 'kyc-reject': { const k = S.kyc.find((x) => x.id === p); k.status = 'rejected'; audit('Identity rejected (KYC)', 'Admin', k.name); break; }
    case 'flag': { const [id, st] = p.split(':'); S.flags.find((f) => f.id === id).status = st; audit('Compliance flag ' + st, 'Admin'); break; }
    default: return;
  }
  save(); render();
});
const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : 'Admin');
function tick() {
  if (!S.upload || S.upload.step >= 4) return;
  setTimeout(() => {
    if (!S.upload) return; S.upload.step++;
    if (S.upload.step === 4 && !company('c3')) { S.companies.push({ id: 'c3', name: 'Seef Digital Services W.L.L.', cr: '120477-1', form: 'With Limited Liability Company', crStatus: 'ACTIVE', reg: '2021-02-09', exp: '2027-02-09', capital: 20000, address: 'Building 118, Road 2804, Block 428, Seef', kyb: 'pending', extraction: 'completed', owner: 'seller' }); audit('CR profile extracted', 'System', 'Seef Digital Services W.L.L.'); }
    save(); if (S.view === 'company') render(); tick();
  }, 900);
}
if (S.upload && S.upload.step < 4) tick();

document.addEventListener('submit', (ev) => {
  ev.preventDefault(); const f = ev.target; const r = S.room;
  if (f.id === 'nda-form') {
    const name = $('#nda-name').value.trim(); const err = $('#nda-err');
    if (name.toLowerCase() !== S.users.buyer.name.toLowerCase()) { err.hidden = false; err.textContent = `Type your full legal name exactly as verified: ${S.users.buyer.name}.`; return; }
    if (!$('#nda-agree').checked) { err.hidden = false; err.textContent = 'Tick the box to agree to the NDA terms.'; return; }
    const e = S.engagements.find((x) => x.id === S.param); advance(e, 'nda_signed'); audit('NDA signed', 'Buyer', listing(e.listing).ref + ' · SHA-256 ' + hash(name + e.id) + hash(e.id)); save(); go('unlock', e.id); toast('NDA signed. The company is now revealed to you.'); return;
  }
  if (f.id === 'ask-form') {
    const body = $('#ask-body').value.trim(); if (!body) return;
    const s = screen(body); r.questions.push({ id: uid(), from: party(), cat: $('#ask-cat').value, body: s.clean, status: 'open', at: now(), answers: [] });
    audit('Question asked', cap(party()), QCATS[$('#ask-cat').value]); flagIfNeeded(body, s.hit); if (!s.hit) toast('Question posted.');
  }
  if (f.classList.contains('reply')) {
    const q = r.questions.find((x) => x.id === f.dataset.q); const ta = f.querySelector('textarea'); const body = ta.value.trim(); if (!body) return;
    const s = screen(body); q.answers.push({ from: party(), body: s.clean, at: now() }); if (q.from !== party() && q.status === 'open') q.status = 'answered';
    audit('Reply posted', cap(party())); flagIfNeeded(body, s.hit); if (!s.hit) toast('Reply posted.');
  }
  if (f.classList.contains('offer-form')) {
    const id = f.dataset.counter; const price = +f.querySelector('[id^=of-price]').value; if (!(price > 0)) { toast('Enter a price above zero.'); return; }
    const o = { id: uid(), from: party(), price, structure: f.querySelector('[id^=of-struct]').value, stake: f.querySelector('[id^=of-struct]').value === 'full' ? 100 : 60, deposit: +f.querySelector('[id^=of-dep]').value || 0, cond: screen(f.querySelector('[id^=of-cond]').value).clean, status: 'open', counter: !!id, at: now() };
    if (id) r.offers.find((x) => x.id === id).status = 'countered';
    r.offers.push(o); advance(S.engagements[0], 'offer'); S.countering = false;
    audit(id ? 'Counter-offer submitted' : 'Offer submitted', cap(party()), bd(price, true)); toast(id ? 'Counter-offer sent.' : 'Offer sent.');
  }
  if (f.id === 'listing-form') {
    const d = { company: $('#lf-company').value, headline: $('#lf-headline').value.trim(), summary: $('#lf-summary').value.trim(), sector: $('#lf-sector').value, revenue: $('#lf-revenue').value, price: $('#lf-price').value, growth: $('#lf-growth').value };
    const err = $('#lf-err'); const clash = nameClash(company(d.company), d.headline + ' ' + d.summary);
    if (!d.headline || !d.summary || !(+d.price > 0) || !(+d.revenue > 0)) { err.hidden = false; err.textContent = 'Add a headline, summary, revenue and asking price.'; return; }
    if (clash) { err.hidden = false; err.textContent = `The teaser is public and must not name the company. Remove "${clash}".`; return; }
    S.sellerDraft = d; save(); go('tier'); return;
  }
  save(); render();
});
document.addEventListener('input', (ev) => { if (ev.target.closest('#listing-form')) listingPreview(); });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && $('#layer').innerHTML) closeModal(); });
render();
</script>
